name: Release

# Cutting a release: add the version's section to CHANGELOG.md, then
# git tag v1.2.3 && git push origin v1.2.3
# (or Actions > Release > Run workflow, with a version).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the WiX toolset
        shell: pwsh
        run: |
          # Pinned to WiX 5. From v6 onwards WiX requires accepting the Open Source Maintenance Fee
          # licence, which is a commercial commitment for DYNATEC and must not be auto-accepted by a
          # build. v5 is the last release without it and already has the <Files> harvesting element
          # the installer needs.
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) {
            # Already installed on a warm runner image: make sure it is the version we expect.
            dotnet tool update --global wix --version 5.0.2
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$tools;$env:PATH"
          & wix --version

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($v)) { $v = $env:REF_NAME -replace '^v', '' }
          # MSI compares numbers only, so a -prerelease tag could never upgrade an install.
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            Write-Host "::error::'$v' is not a valid version number, expected something like 1.2.3."
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Take the release notes from CHANGELOG.md
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The version's section: from its "## 1.2.3 - date" heading to the next heading.
          $section = (Get-Content -Raw CHANGELOG.md) -split '(?m)^## ' |
            Where-Object { $_ -match "^$([regex]::Escape($env:VERSION))(\s|$)" } |
            Select-Object -First 1
          if (-not $section) {
            Write-Host "::error::CHANGELOG.md has no section for $env:VERSION. Add '## $env:VERSION - <date>' with what changed."
            exit 1
          }
          # Each entry on one line: release notes break lines where the file wraps them.
          $notes = ($section -split "`n", 2)[1].Trim() -replace '\r?\n {2,}', ' '
          $notes | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Encoding utf8
          Get-Content (Join-Path $env:RUNNER_TEMP 'release-notes.md')

      - name: Build the release artifacts
        shell: pwsh
        run: ./build/release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EasyPDF ${{ steps.version.outputs.version }}
          # The changelog's section, followed by GitHub's link to the full list of commits.
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/EasyPDF-${{ steps.version.outputs.version }}-x64.msi
            artifacts/EasyPDF-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/SHA256SUMS.txt
